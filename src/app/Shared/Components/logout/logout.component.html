@if (open) {
  <div class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-3">

        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title fw-semibold">Confirm Logout</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>

        <!-- Body -->
        <div class="modal-body text-center">
        <app-delete-confirm [title]="'Logout?'" [description]="`are you sure you want to logout? if you are sure just click on it`"></app-delete-confirm>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
          <button type="button" class="btn btn-outline-danger d-flex align-items-center justify-content-center gap-2" (click)="logOut()" >

            <span>Logout</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Overlay -->
  <div class="modal-backdrop fade show"></div>
}
